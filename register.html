<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Attendance Manager</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<header><div class="wrap"><strong>Attendance Manager</strong><nav aria-label="Workspace"><button data-page="daily" aria-pressed="true">Daily register</button><button data-page="roster" aria-pressed="false">Students</button><button data-page="report" aria-pressed="false">Reports</button></nav></div></header>
<main class="wrap"><p id="notice" role="status"></p>
<section id="daily"><h1>Daily register</h1><div class="bar"><label>Register date <input type="date" id="day"></label><button id="reload">Reload day</button></div>
<div class="stats" id="counts"></div><div class="panel"><div class="bar"><h2>Attendance sheet</h2><button id="all">Mark all present</button></div><div id="sheet"></div><button class="primary" id="save">Save register</button></div></section>
<section id="roster" hidden><h1>Students</h1><form class="panel bar" id="add"><label>Roll number <input id="roll" maxlength="30" required></label><label>Full name <input id="name" maxlength="100" required></label><button class="primary">Add student</button></form><div class="panel"><h2>Class roster</h2><div id="students"></div></div></section>
<section id="report" hidden><h1>Attendance report</h1><form class="panel bar" id="range"><label>From <input type="date" id="start" required></label><label>Through <input type="date" id="end" required></label><button class="primary">View summary</button></form><div class="panel"><div class="bar"><h2>Student summary</h2><a id="csv" hidden>Download CSV</a></div><p id="caption">Choose the date range and select View summary.</p><div id="results"></div></div></section>
</main></body></html>
